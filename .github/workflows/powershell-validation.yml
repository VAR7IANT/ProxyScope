name: PowerShell validation

on:
  push:
    branches:
      - main
    paths:
      - "**/*.ps1"
      - "Run ProxyScope.bat"
      - ".github/workflows/powershell-validation.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "Run ProxyScope.bat"
      - ".github/workflows/powershell-validation.yml"

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $failed = $true
                  Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
                  $errors | ForEach-Object {
                      Write-Host (
                          "Line {0}, column {1}: {2}" -f
                          $_.Extent.StartLineNumber,
                          $_.Extent.StartColumnNumber,
                          $_.Message
                      ) -ForegroundColor Red
                  }
              }
          }

          if ($failed) {
              exit 1
          }

      - name: Verify required modules
        shell: powershell
        run: |
          $required = @(
              "src\ProxyScope.ps1",
              "src\modules\Common.ps1",
              "src\modules\Network.ps1",
              "src\modules\Report.ps1",
              "src\modules\ReportCompatibility.ps1",
              "src\modules\Diagnosis.ps1",
              "src\modules\UI.ps1"
          )

          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }

          if ($missing) {
              $missing | ForEach-Object { Write-Host "Missing: $_" -ForegroundColor Red }
              exit 1
          }

          Write-Host "All required ProxyScope modules are present"
